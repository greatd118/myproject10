<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="3;url=login.html">
  <title>MyApp</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #c9d1d9;
    }
    .splash {
      text-align: center;
      animation: fadeIn 1s ease;
    }
    .splash h1 {
      font-size: 48px;
      background: linear-gradient(135deg, #58a6ff, #3fb950);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }
    .splash p {
      margin-top: 15px;
      color: #8b949e;
      font-size: 18px;
    }
    .splash .loader {
      margin-top: 25px;
      width: 40px;
      height: 40px;
      border: 4px solid #30363d;
      border-top: 4px solid #58a6ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: inline-block;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      0% { opacity: 0; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="splash">
    <h1>🚀 MyApp</h1>
    <p>Loading, silakan tunggu...</p>
    <div class="loader"></div>
    <p style="margin-top:20px; font-size:13px; color:#484f58;">Redirecting ke halaman login...</p>
  </div>

  <!-- Redirect otomatis ke login.html setelah 3 detik (udah pake meta refresh di atas) -->
</body>
</html>
